    <main>

      <header>
        <h1>Let's get <span class="header-split">in touch!</span></h1>

      </header>

      <!-- Form base taken from I211 groose-recipe-app 2025 -->

      <section class="form">
        <h2>Contact Me</h2>

      <form action="https://formspree.io/f/xeoyddao" method="post">

        <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" name="name" id="name" placeholder="Your Name" minlength=2 maxlength=50 required>
            <div class="invalid-feedback">Name must be between 1 and 50 characters</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="text" class="form-control" id="email" name="email" placeholder="email@gmail.com" minlength="2" maxlength="50" required></input>
            <div class="invalid-feedback">Text must be less than 50 characters</div>
        </div>
     
        <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea class="form-control" name="message" id="message" placeholder="What's this about?" required></textarea>
        </div>
        
      
         <div class="mt-4">
             <button class="btn btn-primary" type="submit">Send</button>
             <button class="btn btn-secondary" type="reset">Clear</button>
         </div>
     </form>
    </section>


    </main>


    <footer class="footer mt-auto py-3">

     <!-- JavaScript from 1360 Project 3 Fall 2025 -->
     <script>
        // once the dropdown is toggled, add the class 'show' to each menu item to reveal it
        // if clicked again, toggle this effect by removing the 'show' class
        function toggleDropdown() {
          document
            .querySelectorAll(".menu-item")
            .forEach((item) => item.classList.toggle("show"));
        }
        // On the element with the class menu-button, wait for it to be clicked, then toggle the dropdown
        document
          .querySelector(".menu-button")
          .addEventListener("click", toggleDropdown);
      </script>


</body>
